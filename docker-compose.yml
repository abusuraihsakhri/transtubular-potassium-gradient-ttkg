version: '3.8'

services:
  transtubular-potassium-gradient-ttkg:
    build: .
    container_name: transtubular-potassium-gradient-ttkg
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=transtubular-potassium-gradient-ttkg-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
